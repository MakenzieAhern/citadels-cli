<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" role="img" aria-labelledby="title desc">
<title id="title">Citadels CLI architecture</title>
<desc id="desc">App passes arguments into Game. Game coordinates players and character roles, loads the bundled district catalogue, and saves validated JSON checkpoints through GameState and GameStateStore.</desc>
